name: Validate tracker data
on:
  pull_request:
    paths: ['examples/proof-reuse/**', 'tracker/**', 'completed/**', 'evidence/**', 'verify.sh', 'Audit.lean', 'audit/**', 'tests/**', '.github/workflows/validate-tracker.yml']
  push:
    branches: [main]
    paths: ['examples/proof-reuse/**', 'tracker/**', 'completed/**', 'evidence/**', 'verify.sh', 'Audit.lean', 'audit/**', 'tests/**', '.github/workflows/validate-tracker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check that the ledger files agree with each other
        run: python3 tracker/validate_tracker.py
      - name: Run the tracker unit tests (includes the validator regression tests)
        run: python3 -m unittest discover -s tracker -p 'test_*.py' -v
      - name: Run the proof scanner unit tests
        run: python3 -m unittest discover -s examples/proof-reuse -p 'test_*.py' -v
      - name: Check verifier integrity guards
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          bash tests/test-verify-sh.sh
